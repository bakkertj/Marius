[package]
name = "marius-sync-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Self-hosted sync backend for Marius (SYNC-004)"

# Excluded from the root workspace like the desktop app: the HTTP stack is
# a heavy dependency tree, and every decision this binary makes lives in
# `marius-sync-service`, which the root workspace builds and tests.
[workspace]

[dependencies]
marius-model = { path = "../../crates/model" }
marius-sync-service = { path = "../../crates/sync-service" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
